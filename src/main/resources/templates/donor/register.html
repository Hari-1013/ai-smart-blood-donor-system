<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donor Registration</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><div class="brand">🩸 SmartBlood AI</div><a href="/login" class="btn ghost">Login</a></nav><main class="container narrow"><div class="page-head"><span class="eyebrow">DONOR REGISTRATION</span><h1>Become a verified donor.</h1><p>Enter accurate details. Blood-bank staff will verify your profile before matching.</p></div><form class="panel form-grid" method="post" action="/donor/register"><label>Full name<input name="fullName" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><label>Blood group<select name="bloodGroup" required><option th:each="g : ${T(com.blooddonor.entity.BloodGroup).values()}" th:value="${g}" th:text="${g}"></option></select></label><label>Age<input type="number" name="age" min="18" required></label><label>Weight (kg)<input type="number" name="weight" min="50" step="0.1" required></label><label>City<input name="city" required></label><label>Phone<input name="phone" required></label><label>Latitude<input type="number" step="any" name="latitude" value="11.0168"></label><label>Longitude<input type="number" step="any" name="longitude" value="76.9558"></label><div class="span2"><button class="btn primary">Submit Registration</button></div></form></main></body></html>
