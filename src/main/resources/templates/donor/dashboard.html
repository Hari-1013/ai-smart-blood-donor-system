<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donor Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><div class="brand">🩸 SmartBlood AI</div><div><a href="/auth/logout" class="btn ghost">Logout</a></div></nav><main class="container"><div class="page-head"><span class="eyebrow">DONOR WORKSPACE</span><h1>Welcome, <span th:text="${donor.fullName}">Donor</span>.</h1><p>Your availability helps the matching engine find you when a compatible request appears.</p></div><div class="stats"><div class="stat"><span>Blood group</span><strong th:text="${donor.bloodGroup}"></strong></div><div class="stat"><span>Verification</span><strong th:text="${donor.verified?'VERIFIED':'PENDING'}"></strong></div><div class="stat"><span>Availability</span><strong th:text="${donor.available?'AVAILABLE':'OFFLINE'}"></strong></div><div class="stat"><span>City</span><strong th:text="${donor.city}"></strong></div></div><section class="panel"><div class="panel-head"><h2>Donation Availability</h2><span class="tag">LIVE</span></div><form method="post" action="/donor/availability"><button name="available" value="true" class="btn primary">Available to Donate</button><button name="available" value="false" class="btn ghost">Temporarily Unavailable</button></form></section><section class="panel"><div class="panel-head"><h2>Donation History</h2></div><div th:if="${#lists.isEmpty(history)}" class="empty">No donations recorded.</div><table th:if="${!#lists.isEmpty(history)}"><thead><tr><th>Date</th><th>Request</th><th>Units</th></tr></thead><tbody><tr th:each="d:${history}"><td th:text="${d.donationDate}"></td><td th:text="${d.request.hospitalName}"></td><td th:text="${d.units}"></td></tr></tbody></table></section></main></body></html>
