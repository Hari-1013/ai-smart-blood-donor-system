<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood Request</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><div class="brand">🩸 SmartBlood AI</div><a href="/staff/dashboard" class="btn ghost">Dashboard</a></nav><main class="container narrow"><div class="page-head"><span class="eyebrow">NEW REQUEST</span><h1>Create a blood request.</h1></div><form class="panel form-grid" method="post" action="/requests"><label>Patient name<input name="patientName" required></label><label>Hospital name<input name="hospitalName" required></label><label>Blood group<select name="bloodGroup"><option th:each="g:${T(com.blooddonor.entity.BloodGroup).values()}" th:value="${g}" th:text="${g}"></option></select></label><label>Units<input type="number" min="1" name="units" required></label><label>City<input name="city" required></label><label>Urgency<select name="urgency"><option>CRITICAL</option><option>HIGH</option><option>NORMAL</option></select></label><label>Latitude<input name="latitude" type="number" step="any" value="11.0168"></label><label>Longitude<input name="longitude" type="number" step="any" value="76.9558"></label><label class="span2">Contact phone<input name="contactPhone" required></label><div class="span2"><button class="btn primary">Create & Find AI Matches</button></div></form></main></body></html>
