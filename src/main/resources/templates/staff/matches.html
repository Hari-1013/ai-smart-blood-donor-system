<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Matches</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><div class="brand">🩸 SmartBlood AI</div><a href="/staff/dashboard" class="btn ghost">Dashboard</a></nav><main class="container"><div class="page-head"><span class="eyebrow">AI MATCHING ENGINE</span><h1>Recommended donors.</h1><p>Request <b th:text="${request.id}"></b> · <span th:text="${request.bloodGroup}"></span> · <span th:text="${request.urgency}"></span></p></div><div class="match-grid"><article class="match-card" th:each="m:${matches}"><div class="score" th:text="${#numbers.formatDecimal(m.score,1,0)}+'%'">95%</div><h2 th:text="${m.donor.fullName}"></h2><p><b th:text="${m.donor.bloodGroup}"></b> · <span th:text="${m.donor.city}"></span></p><p th:text="${m.reason}"></p><div class="progress"><i th:style="'width:'+${m.score}+'%'"/></div><a class="btn primary full" th:href="'tel:'+${m.donor.phone}">Contact Donor</a></article></div><div th:if="${#lists.isEmpty(matches)}" class="empty panel">No eligible verified donors found for this request.</div></main></body></html>
