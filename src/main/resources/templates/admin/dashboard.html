<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><div class="brand">🩸 SmartBlood AI · Admin</div><a href="/auth/logout" class="btn ghost">Logout</a></nav><main class="container"><div class="page-head"><span class="eyebrow">SYSTEM ADMINISTRATION</span><h1>Manage the platform.</h1><p>Monitor accounts and donor verification data.</p></div><div class="stats"><div class="stat"><span>Donors</span><strong th:text="${donorCount}"></strong></div><div class="stat"><span>Requests</span><strong th:text="${requestCount}"></strong></div><div class="stat"><span>Accounts</span><strong th:text="${userCount}"></strong></div></div><section class="panel"><div class="panel-head"><h2>Donor Directory</h2></div><table><thead><tr><th>Name</th><th>Email</th><th>Group</th><th>City</th><th>Verified</th><th>Available</th></tr></thead><tbody><tr th:each="d:${donors}"><td th:text="${d.fullName}"></td><td th:text="${d.email}"></td><td th:text="${d.bloodGroup}"></td><td th:text="${d.city}"></td><td th:text="${d.verified}"></td><td th:text="${d.available}"></td></tr></tbody></table></section></main></body></html>
